name: hermes-dev-browser
version: 2.0.0
description: "Full-featured web browser pane with DevTools, multi-tab, OAuth support, element picker, bookmarks, incognito mode, and 41 agent-controlled automation tools (navigation, DOM inspection, form filling, mouse/keyboard simulation, network interception, screenshots, and more)."
author: alvarolizama
kind: backend
